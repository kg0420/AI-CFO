<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CFO - Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">AI CFO</h1>
            <p class="text-slate-500 mt-2" id="form-subtitle">Sign in to your account</p>
        </div>

        {% if error %}
        <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center mb-4 border border-red-200">
            {{ error }}
        </div>
        {% endif %}
        {% if message %}
        <div class="bg-green-50 text-green-600 p-3 rounded-lg text-sm text-center mb-4 border border-green-200">
            {{ message }}
        </div>
        {% endif %}

        <!-- Login Form -->
        <form id="login-form" action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Username</label>
                <input type="text" name="username" required class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Password</label>
                <input type="password" name="password" required class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition">Login</button>
            <p class="text-center text-sm text-slate-600 mt-4">
                Don't have an account? <a href="#" onclick="toggleForm('register')" class="text-blue-600 hover:underline">Sign up</a>
            </p>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="register-form" action="/register" method="POST" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-slate-700">Choose a Username</label>
                <input type="text" name="username" required class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Create a Password</label>
                <input type="password" name="password" required class="mt-1 block w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-slate-800 text-white font-semibold py-2 rounded-lg hover:bg-slate-900 transition">Register</button>
            <p class="text-center text-sm text-slate-600 mt-4">
                Already have an account? <a href="#" onclick="toggleForm('login')" class="text-blue-600 hover:underline">Log in</a>
            </p>
        </form>
    </div>

    <script>
        function toggleForm(type) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const subtitle = document.getElementById('form-subtitle');

            if (type === 'register') {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                subtitle.innerText = "Create a new account";
            } else {
                registerForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                subtitle.innerText = "Sign in to your account";
            }
        }
    </script>
</body>
</html>
